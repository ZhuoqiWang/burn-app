name: Build Flet APK (Manual)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: |
          pip install flet==1.0.5

      - name: Build APK
        env:
          FLET_CLI_LOG_FORMAT: "plain"   # 保持纯文本日志，避免解析问题
        run: |
          flet build apk -y --verbose    # -y 自动确认所有提示

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: burn-calculator-apk
          path: build/apk/*.apk
          if-no-files-found: error
