name: Build Flet APK (Stable)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 关键：使用专用 Action 安装完整 Flutter SDK，自动处理 PATH 和缓存
      - name: Set up Flutter 3.44.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Verify Flutter and Precache Engine
        run: |
          flutter --version
          flutter precache --android # 强制下载 Android 引擎产物，预防 sky_engine 缺失

      - name: Install Flet
        run: |
          pip install flet==1.0.5

      - name: Build APK
        run: |
          flet build apk --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: burn-calculator-apk
          path: build/apk/*.apk
          if-no-files-found: error
