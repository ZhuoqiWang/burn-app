name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK with Flet
        uses: flet-dev/flet-build-action@v1
        env:
          FLET_BUILD_NO_RICH_OUTPUT: "true"
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: burn-calculator-apk
          path: build/apk/*.apk
          if-no-files-found: error
