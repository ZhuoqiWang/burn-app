name: Build Flet APK (Manual)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone Flutter SDK 3.44.8
        run: |
          git clone --depth 1 --branch 3.44.8 https://github.com/flutter/flutter.git $HOME/flutter

      - name: Add Flutter to PATH
        run: |
          echo "$HOME/flutter/bin" >> $GITHUB_PATH

      - name: Verify Flutter
        run: |
          flutter --version

      - name: Install Flet
        run: |
          pip install flet==1.0.5

      - name: Build APK
        run: |
          flet build apk --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: burn-calculator-apk
          path: build/apk/*.apk
          if-no-files-found: error
